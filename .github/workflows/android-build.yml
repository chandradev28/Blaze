name: Blaze Android build

# Deliberately manual for the first build. Pushing this repository will not
# start GitHub Actions until the owner chooses "Run workflow" in GitHub.
on:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Clean generated APKs
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare clean release artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk Blaze-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Blaze-release-APK
          path: Blaze-release.apk
